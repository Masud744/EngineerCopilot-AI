name: Daily Job Sync

on:
  schedule:
    - cron: "0 6 * * *"  # 6 AM UTC = 12 PM Bangladesh
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync-jobs:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run job sync
        run: |
          cd backend
          python -m app.scripts.cleanup_jobs || true
          python -c "
          import asyncio
          import sys
          sys.path.insert(0, '.')
          from app.services.job_scraper import sync_jobs
          result = asyncio.run(sync_jobs())
          print(result)
          "

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Job Sync Failed - ' + new Date().toISOString().split('T')[0],
              body: 'Daily job sync workflow failed. Check logs.',
            })
